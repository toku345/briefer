name: Biome Migrate

on:
  pull_request_target:
    branches: [main]

permissions: {}

jobs:
  migrate:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.title, 'biome')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".tool-versions"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run biome migrate
        run: bunx biome migrate --write

      - name: Commit changes if any
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biome.json
          # biome migrate が想定外のファイルを変更した場合は即座に停止
          if ! git diff --quiet; then
            echo "::error::biome migrate modified files beyond biome.json"
            git diff --name-only
            exit 1
          fi
          git commit -m "chore: migrate biome schema version"
          git push
